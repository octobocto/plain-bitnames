[build-dependencies]

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
bech32 = { workspace = true }
bincode = { workspace = true }
bitcoin = { workspace = true, features = ["serde"] }
blake3 = { workspace = true }
borsh = { workspace = true, features = ["derive"] }
clap = { workspace = true, features = ["derive"], optional = true }
const-hex = { workspace = true, features = ["serde"] }
curve25519-dalek = { workspace = true, features = ["serde"] }
ed25519-bip32 = { workspace = true }
educe = { workspace = true, features = ["Clone", "Debug"] }
frost-core = { workspace = true, features = ["internals"] }
frost-ristretto255 = { workspace = true, features = ["serde"] }
generic-array = { workspace = true }
heed = { workspace = true, optional = true }
hex-literal = { workspace = true }
merkle-cbt = { workspace = true }
nonempty = { workspace = true, features = ["serialize"] }
rand = { workspace = true, features = ["chacha"] }
rayon = { workspace = true }
semver = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = {  workspace = true }
serde_with = {  workspace = true, features = ["hex", "macros"] }
strum = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
typenum = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true, features = ["macros", "non_strict_integers"] }
x25519-dalek = { workspace = true, features = ["serde"] }

[dev-dependencies]
rand = { workspace = true, features = ["thread_rng"] }

[dependencies.libes]
workspace = true
features = ["AES256-GCM", "ECIES-MAC", "HMAC-SHA256", "x25519"]

[features]
clap = ["dep:clap"]
heed = ["dep:heed"]

[lints]
workspace = true

[lib]
name = "plain_bitnames_types"
path = "lib.rs"

[package]
name = "plain_bitnames_types"
authors.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
version.workspace = true
